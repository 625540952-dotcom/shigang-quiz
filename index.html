<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#4a7bf7">

<title>中国近现代史纲要 · 平时测验题库</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#f2f4f8;color:#1f2430;overscroll-behavior-y:none;
 font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
body.hasfoot{padding-bottom:86px}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:21px;margin:6px 0 4px;letter-spacing:.5px;line-height:1.45}
.sub{color:#7b8496;font-size:13.5px;margin:0 0 16px;line-height:1.65}
.cards{display:grid;gap:12px}
@media(min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(24,39,75,.09);
 padding:15px 17px}
.entry{cursor:pointer;transition:.15s;border:1px solid transparent}
.entry:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(24,39,75,.14);
 border-color:#c8d5f5}
.entry.wide{grid-column:1/-1}
.entry h3{margin:0 0 6px;font-size:16.5px;color:#1b3a8f}
.entry p{margin:0;color:#7b8496;font-size:13.5px}
.entry .badge{display:inline-block;background:#eef2fd;color:#2b52b8;border-radius:20px;
 font-size:12px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.stats{margin-top:16px;color:#7b8496;font-size:13px;text-align:center;line-height:1.9}
.stats a{color:#b04a4a;text-decoration:none;margin-left:8px}
.warn{background:#fff8e6;border:1px solid #f0dfae;color:#8a6d1f;border-radius:10px;
 padding:12px 14px;font-size:13.5px;line-height:1.75;margin-top:14px}
.warn b{color:#7a5c0d}
.okbox{background:#eefaf1;border:1px solid #cbe9d7;color:#2c7a4f;border-radius:10px;
 padding:11px 14px;font-size:13.5px;line-height:1.7;margin-top:14px}
.topbar{position:sticky;top:0;z-index:6;background:rgba(242,244,248,.97);
 backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 display:flex;align-items:center;gap:10px;font-size:14px;
 padding:9px 0;margin:-9px 0 8px;border-bottom:1px solid rgba(226,231,241,.8)}
.topbar .back{color:#2b52b8;cursor:pointer;text-decoration:none;white-space:nowrap}
.topbar .mode{color:#1f2430;font-weight:600;white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis}
.topbar .pos{margin-left:auto;color:#7b8496;white-space:nowrap}
.bar{height:5px;background:#e2e7f1;border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a7bf7,#7aa2ff);
 border-radius:4px;transition:width .25s}
.q{position:relative;padding-top:20px}
.tag{position:absolute;top:-1px;right:15px;background:#eef2fd;color:#2b52b8;
 font-size:11.5px;padding:1px 9px;border-radius:0 0 8px 8px}
.stem{font-size:17px;font-weight:600;line-height:1.78;margin-bottom:15px;
 white-space:pre-wrap;word-break:break-word}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:9px;
 border:1.5px solid #e2e7f1;border-radius:10px;cursor:pointer;transition:.13s;
 background:#fcfdff;touch-action:manipulation}
.opt:active{transform:scale(.99)}
.opt b{flex:0 0 24px;height:24px;line-height:24px;text-align:center;border-radius:50%;
 background:#eef2fd;color:#2b52b8;font-size:13px;font-weight:700;margin-top:1px}
.opt span{flex:1}
.opt.right{border-color:#39a56a;background:#eefaf1}
.opt.right b{background:#39a56a;color:#fff}
.opt.wrong{border-color:#d9534f;background:#fdeeee}
.opt.wrong b{background:#d9534f;color:#fff}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}
.fb{margin:14px 0 12px;padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;
 line-height:1.65}
.fb.ok{background:#eefaf1;color:#2c7a4f}
.fb.no{background:#fdeeee;color:#b0392f}
.expl{padding:14px 17px;background:#fffdf5;border:1px solid #f0e6c8}
.expl .eh{font-size:13px;color:#a08a3c;font-weight:700;margin-bottom:6px}
.expl .et{font-size:14.5px;line-height:1.85;color:#4a4a52;white-space:pre-wrap}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;padding:13px 8px;border:none;border-radius:10px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:15px;cursor:pointer;transition:.13s;
 touch-action:manipulation}
.nav button:active{background:#3a68db}
.nav button:disabled{background:#c9d2e3;cursor:default}
.nav button.ghost{flex:0 0 92px;background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.nav button.ghost:active{background:#f0f4fb}
.witem{padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:.13s}
.witem:active{border-color:#a9c0f0}
.witem .ws{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.65}
.witem .wm{font-size:12.5px;color:#7b8496}
.witem .wm em{color:#d9534f;font-style:normal}
.empty{text-align:center;color:#8f98a8;padding:52px 20px;font-size:15px;line-height:2}
.result{text-align:center;padding:30px 20px}
.result .big{font-size:46px;font-weight:700;color:#2b52b8;line-height:1.2}
.result .lbl{color:#7b8496;font-size:14px;margin-bottom:20px}
.rbars{max-width:420px;margin:0 auto 20px;text-align:left;font-size:14px}
.rbars div{display:flex;justify-content:space-between;padding:7px 0;
 border-bottom:1px solid #eef1f6}
.kbd{font-size:12.5px;color:#9aa3b2;text-align:center;margin-top:24px;line-height:1.9}
.kbd kbd{background:#eef1f6;border-radius:4px;padding:1px 6px;font-family:inherit;color:#5a6478}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:7;
 background:rgba(242,244,248,.98);border-top:1px solid #e2e7f1;
 padding:9px 16px calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px}
.foot button{flex:1;padding:11px 8px;border:none;border-radius:10px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:14.5px;cursor:pointer;touch-action:manipulation}
.foot button.g{background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,26,40,.45);
 display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.ovbox{background:#fff;border-radius:14px;padding:19px;max-width:440px;width:100%;
 max-height:86vh;overflow:auto;box-shadow:0 14px 44px rgba(0,0,0,.28)}
.ovt{font-size:17px;font-weight:700;margin-bottom:9px}
.ovm{font-size:14px;color:#4a4a52;line-height:1.78}
.ovm p{margin:0 0 6px}
.ovin{width:100%;padding:11px;border:1.5px solid #dbe2ee;border-radius:9px;
 font:inherit;font-size:16px;margin-top:10px}
.ovta{width:100%;height:132px;padding:10px;border:1.5px solid #dbe2ee;border-radius:9px;
 font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;margin-top:10px;
 word-break:break-all;resize:none;-webkit-user-select:all;user-select:all}
.ovb{display:flex;gap:10px;margin-top:15px}
.ovb button{flex:1;padding:12px;border:none;border-radius:9px;background:#4a7bf7;
 color:#fff;font:inherit;font-size:15px;cursor:pointer;touch-action:manipulation}
.ovb button.ghost{background:#fff;color:#4a5a7a;border:1.5px solid #dbe2ee}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);
 background:rgba(30,36,50,.93);color:#fff;padding:10px 18px;border-radius:22px;
 font-size:13.5px;max-width:82%;text-align:center;line-height:1.6;
 opacity:0;transition:opacity .22s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
</style>
</head>

<script>
'use strict';
var BANK = [{"k":1,"d":0,"s":"鸦片战争以后，中国社会的最主要矛盾逐渐变为（）。","o":["封建主义和资本主义的矛盾","封建主义和人民大众的矛盾","清政府和西方列强的矛盾","中华民族和外国资本主义的矛盾"],"a":3,"e":"鸦片战争使中国社会的主要矛盾发生变化，主要有封建主义和人民大众的矛盾及外国资本主义和中华民族的矛盾，后者是最主要的矛盾。"},{"k":1,"d":0,"s":"中国共产党成立后的中心任务是（）。","o":["开展工人运动","组织建立农村根据地","组织农民打土豪分田地","夺取全国政权"],"a":0,"e":"考察中共一大的内容，确立了组织工人阶级开展工人运动的任务。"},{"k":1,"d":1,"s":"《共同纲领》最基本、最核心的内容是（）。","o":["关于经济方针的规定","关于国体和政体的规定","关于民族政策的规定","关于外交政策的规定"],"a":1,"e":"《共同纲领》起着临时宪法的作用。《共同纲领》最基本、最核心的内容是关于新中国的国体和政体的规定，这项规定从法律上正式确立了中国共产党在全国的执政地位。故选项B正确。"},{"k":1,"d":1,"s":"1946年6月全面内战爆发时，国民党军队首先进攻的地区是（）","o":["中原解放区","陕甘宁解放区","东北解放区","山东解放区"],"a":0,"e":"1946年6月底，国民党军以进攻中原解放区为起点，挑起了全国性的内战。同年10月11日，国民党军占领华北解放区重镇张家口。"},{"k":1,"d":1,"s":"1933年11月，在福州发动抗日反蒋事变的国民党爱国将领是（）。","o":["马占山和李杜","蔡廷锴和蒋光鼐","张学良和杨虎城","冯玉祥和吉鸿昌"],"a":1,"e":"1933年11月，国民党第十九军将领蔡廷锴、蒋光鼐以及国民党内爱国人士李济深、陈铭枢等在福州发动反蒋抗日事变。"},{"k":1,"d":0,"s":"\"我们就这样以最野蛮的方式摧毁了世界上最宝贵的财富。“这反映的事件是（）。","o":["南京大屠杀","火烧圆明园","旅顺大屠杀","江东六十四屯惨案"],"a":1,"e":"第二次鸦片战争期间，英法军队火烧圆明园，此为英国侵略军头目戈登所言。"},{"k":1,"d":0,"s":"有人说，英国是用三样武器打开中国大门的，其使用的先后顺序是（）","o":["商品-鸦片-炮舰","鸦片-商品-炮舰","商品-炮舰-鸦片","炮舰-鸦片-商品"],"a":0,"e":"19世纪初，英国对华贸易长期处于入超状态。为了改变牟取暴利和改变贸易逆差，英国开始向中国走私鸦片并在中国贩卖，赚取了大量白银。由于中国人民强烈反对鸦片贸易，英国政府针对中国的禁烟活动，加紧了发动侵华战争的准备。1840年6月，鸦片战争正式爆发。"},{"k":1,"d":0,"s":"中国近代教育的开始是（）","o":["封建社会时期的私塾学堂","鸦片战争后向西方学习","鸦片战争后翻译西方书籍","洋务运动期间开设新式学堂，派遣留学生"],"a":3,"e":"洋务运动中，为了培养通晓洋务的人才，开办了一批新式学堂，派出了最早的官派留学生，这是中国近代教育的开端。故D正确。"},{"k":1,"d":1,"s":"1935年，日本帝国主义制造了侵略中国的（）。","o":["九一八事变","华北事变","卢沟桥事变","一二八事变"],"a":1,"e":"1931年9月18日——九一八事变；1935年——华北事变；1937年7月7日——卢沟桥事变；1932年1月28日——\"一二八″淞沪抗战。"},{"k":1,"d":0,"s":"戊戌变法运动失败的主要原因是（）。","o":["袁世凯出卖维新派","光绪帝被囚禁","维新派自身的局限性和守旧势力的反对","帝国主义的破坏"],"a":2,"e":"考察维新变法失败的原因，其中客观原因是封建势力过于强大，主观原因最根本的是阶级的局限性，故选C。"},{"k":1,"d":0,"s":"中国半殖民地半封建社会及其特征的形成是（）。","o":["两干多年的封建统治形成的","资本一帝国主义与中国封建势力结合的加深而逐渐形成的","资本一帝国主义对中国侵略形成的","中国人民反侵略斗争形成的"],"a":1,"e":"中国半殖民地半封建社会的形成是在资本-帝国主义和本国封建势力结合的双重作用下形成的。"},{"k":1,"d":1,"s":"在新民主主义革命不同时期，中国共产党提出了多种土地政策，其共同点是（）","o":["体现中国共产党的民主革命纲领","维护农民基本利益","消灭封建剥削","促进社会经济发展"],"a":1,"e":"无论哪一种土地政策，其最根本的目的都是为了维护农民的利益，因为中国共产党代表最广大人民的利益。"},{"k":1,"d":1,"s":"1945年8月至10月，国共双方举行了确认和平建国基本方针的（）。","o":["重庆谈判","北平谈判","西安谈判","南京谈判"],"a":0,"e":"1945年8月14、20、23日，蒋介石三次电邀毛泽东到重庆共商“国际国内各种重要问题”。为了争取和平民主，毛泽东不顾个人安危，于8月28日与周恩来、王若飞赴重庆与国民党当局进行谈判。"},{"k":1,"d":0,"s":"19世纪未资本主义进入帝国主义阶段后，（）成为殖民主义重要的剥削方式，并出现瓜分世界的狂潮。","o":["掠夺土地","贩卖奴隶","商品输出","资本输出"],"a":3,"e":"资本输出是19世纪未资本主义进入帝国主义阶段后殖民主义重要的剥削方式。"},{"k":1,"d":0,"s":"20世纪中国第一次历史性巨变是（）。","o":["辛亥革命","新民主主义革命","社会主义革命","改革开放"],"a":0,"e":"本题为基本知识记忆题，中国近代历史的第一次巨变为辛亥革命。"},{"k":1,"d":0,"s":"下列关于1926-1927年北伐战争的描述错误的是（）。","o":["第四军获铁军称号","国共进行了合作","工农运动支持了北伐","国民政府完全统一了中国"],"a":3,"e":"D项题干错，1928年东北易帜后国民党在形式上统一了全国。"},{"k":1,"d":0,"s":"相持阶段八路军在华北对敌人发动的一场大规模进攻战役是（）","o":["平型关战役","台儿庄战役","雁门关战役","百团大战"],"a":3,"e":"1940年8至12月初，八路军调集105个团对华北日军发动了大规模的以破袭敌人交通线为重要目标的进攻战役，即百团大战。沉重打击了日军的“囚笼冶政策，减轻了正面战场的压力，鼓舞了中国军民抗战胜利的信心，提高了共产党和八路军的声望，在国内外产生了广泛的影响。故D正确。"},{"k":1,"d":0,"s":"1938年5月至6月间，毛泽东系统阐述抗日战争的特点、前途和发展规律的重要演讲是（）","o":["《论持久战》","《新民主主义论》","《抗日救国十大纲领》","《中国革命和中国共产党》"],"a":0,"e":"1938年5月至6月间，毛泽东发表《论持久战》的演讲，总结抗战10个月来的经验，集中全党智慧，系统的阐明了持久抗战的总方针。毛泽东还科学的预测了抗日战争的发展进程：抗日战争将经过战略防御、战略相持、战略反攻三个阶段。其中，战略相持阶段是中国抗日战争取得最后胜利的最关键的阶段。"},{"k":1,"d":0,"s":"《天朝田亩制度》所要解决的中心问题是（）","o":["农民政权问题","农民土地问题","发展资本主义问题","均贫富、等贵贱"],"a":1,"e":"《天朝田亩制度》是一个以解决土地问题为中心的比较完整的社会改革方案，代表了农民要求平均分配土地的强烈愿望，反映了农民反对封建土地所有制的普遍要求，比历代农民起义所提出的口号更深刻一步。故选项B正确。"},{"k":1,"d":0,"s":"在抗日战争中为国捐躯的八路军副参谋长是（）","o":["赵尚志","彭雪枫","杨靖宇","左权"],"a":3,"e":"八路军副参谋长左权、东北抗日联军第二陆军副总指挥赵尚志、新四军第四师师长彭雪枫先后在作战中以身殉国。"},{"k":1,"d":0,"s":"1939年，国民党五届五中全会正式确定的方针是（）。","o":["壤外必先安内","片面抗战","防共、限共、溶共、反共","消极抗战、积极反共"],"a":2,"e":"考察国民党五届五中全会的内容，确定了“防共、限共、溶共、反共”的方针"},{"k":1,"d":0,"s":"袁世凯夺辛亥革命成果后，发动了一系列的反革命活动。他派人刺杀了宋教仁，又与列强签订了“善后大借款”合同。为反对袁世凯的暴行，1913年孙串山领导革命冕人发动了（）。","o":["二次革命","护国战争","护法战争","北伐战争"],"a":0,"e":"1913年宋教仁被刺后，孙中山开始看清了袁世凯的真面目，毅然发动武装反袁的“二次革命”。由于北洋军阀在军事上占绝对优势，而国民党方面缺乏兵力和财力，内部意见又不一致，结果只坚持了两个月就失败了。？"},{"k":1,"d":0,"s":"维新变法运动失败后，被保留下来的是（）","o":["广州万木草堂","长沙时务学堂","京师大学堂","强学会"],"a":2,"e":"维新变法运动失败后，除京师大 },{"k":1,"d":0,"s":"以下属于严复翻译的著作是（）","o":["《新学伪经考》","《变法通议》","《天演论》","《人类公理》"],"a":2,"e":"在维新运动中，严复翻译了英国博物学家赫胥黎的《进化与伦理》的前两篇，名为《天演论》。故C正确。"},{"k":1,"d":0,"s":"1898年6月下“明定国是”诏，宣布变法维新的皇帝是（）","o":["康熙","乾隆","光绪","宣统"],"a":2,"e":"1898年6月11日，光绪皇帝颁布了“明定国是”谕旨，宣布开始变法，在此后的103天中，连续发布了一系列推动变法的政令，史称“戊戌变法”，又称“百日维新”。因此答案是C。"},{"k":1,"d":0,"s":"八七会议前后，中共发动的几次大规模武装起义均以夺取大城市为目标，这种情况表明（）。","o":["我党在城市拥有相对强大的革命力量","敌人在某些大城市力量不足","盲目模仿俄国革命经验","我党尚未充分认识到工人是革命的主力"],"a":2,"e":"大革命失败后，中国共产党先后进行了南昌起义、秋收起义、广州起义，均以进攻大城市为主，主要盲目模仿俄国，未能从中国实际出发。"},{"k":1,"d":0,"s":"洋务运动的主张是（）\"师夷长技以制夷\"","o":["\"自强\"","“求富\"","\"中学为体，西学为用\"","\"振兴中华\""],"a":1,"e":"洋务运动分为前期和后期，前期洋务派兴办军事工业，以“自强”为目的，19世纪70年代开始，洋务派开始创办民用工业，以“求富”为目标。故B正确。"},{"k":1,"d":1,"s":"毛泽东在1927年中共八七会议上提出的著名论断是（）","o":["没有调查，没有发言权","须知政权是由枪杆子中取得的","兵民是胜利之本","一切反动派都是纸老虎"],"a":1,"e":"考查八七会议的内容，八七会议不仅纠正了陈独秀的右倾机会主义错误，而且毛泽东还做了枪杆子里出政权的著名论断。关闭当前窗"},{"k":1,"d":1,"s":"大革命失败后，中国革命能够坚持和发展的根本原因是（）","o":["开展了土地革命","开展了武装斗争","开展了根据地建设","实行“工农武装割据\""],"a":0,"e":"在大革命失败、白色恐怖极其严重的条件下，中国革命之所以能够得到坚持和发展，根本原因就在于中国共产党紧紧地依靠了农民，领导农民进行了土地制度的革命。因此，A项正确。"},{"k":1,"d":0,"s":"遵义会议后，中共中央政治局成立了新的三人团负责红军的军事行动，其成员有（）。","o":["周恩来、毛泽东、朱德","毛泽东、朱德、王稼祥","周恩来、毛泽东、王稼祥","周恩来、毛泽东、张闻天"],"a":2,"e":"1934年第四次反围剿失败被迫长征，遵义会议集中解决了党在军事上和组织上的问题，成立了以毛泽东、周恩来、王稼祥为主的三人团。"},{"k":1,"d":0,"s":"《海国图志》在当时的作用是（","o":["冲破了闭关锁国的状态","开创了中国近代向西方学习的新风","介绍了西方的先进技术","探索出强国御辱之路"],"a":1,"e":"魏源在1843年1月编成了《海国图志》，在书中提出了”师夷长技以制夷”的思想，主张学习外国先进的军事科学技术，以期富国强兵，抵御外国侵略，开创了中国近代向西方学习的新风，因此答案是B。"},{"k":1,"d":0,"s":"1935年10月19日，中央红军历经艰险、胜利到达陕北（）。","o":["吴起镇","瓦窑堡","延安","南泥湾"],"a":0,"e":"1934年10月红军被迫撤离中央革命根据地，进行战略转移，1935年1月召开遵义会议，1935年10月红军到达陕甘宁革命根据地吴起镇。"},{"k":1,"d":0,"s":"中共二大提出了资产阶级、小资产阶级政党从来没有采取过的革命方法是（）。","o":["统一战线方法","议会斗争方法","群众路线方法","武装斗争方法"],"a":2,"e":"中国共产党一经成立，中国革命就展现了新的面貌。主要是：第一次提出了反帝反封建的民主革命纲领；开始采取民族资产阶级、小资产阶级的政党和政治派别没有采取过、也不可能采取的群众路线的方法。"},{"k":1,"d":0,"s":"中国资产阶级民主革命是由以孙中山为首的资产阶级革命派首先发动的，资产阶级革命派的骨干、辛亥革命的中坚力量是（）。","o":["大资产阶级及其知识分子","民族资产阶级及其知识分子","资产阶级及其知识分子","资产阶级和小资产阶级知识分子"],"a":3,"e":"资产阶级和小资产阶级知识分子是资产阶级革命派的骨干；辛亥革命时期中国的资产阶级还未划分为大资产阶级和民族资产阶级，AB选项错误。D选项正确。"},{"k":1,"d":0,"s":"全国性抗战开始后，中国军队的第一次重大胜利、粉碎了日军不可战胜的神话的战役是（）","o":["平型关战役","长沙会战","台儿庄战役","淞沪会战"],"a":0,"e":"1937年9月，八路军一一五师主力在晋东北平型关附近伏击日军，歼敌一千余人，平型关战役是全民族抗战以来中国军队的第一次重大胜利，粉碎了日军不可战胜的神话；台儿庄战役的时间晚；淞沪会战以国民党战败结束；长沙会战总共三次，有胜有败。故A选项正确。"},{"k":1,"d":1,"s":"1952年1月，中共中央决定开展打击不法资本家的（）。","o":["镇压反革命运动","工商业调整运动","\"三反”运动","\"五反”运动"],"a":3,"e":"为打击不法资本家，开展了反行贿、反偷税漏税、反盗骗国家财产、反盗窃国家经济情报的五反运动。"},{"k":1,"d":0,"s":"中华民国临时政府的性质是（）","o":["资产阶级共和国性质的革命政权","大地主资产阶级专制政府","无产阶级占主导地位的政权","名阶级联合执政的政府"],"a":0,"e":"南京临时政府是资产阶级共和国性质的革命政权。在人员构成上，资产阶级革命派控制着这个政权。除孙中山作为临时大总统拥有统治全国和统率海、陆军之权外，陆军、外交等重要部的总长和所有各部的次长全由革命党人担任。同盟会会员在作为国家立法机关的临时参议院中占多数。在实行的各项政策措施上，集中体现了中国民族资产阶级的愿望和利益，在一定程度上符合广大中国人民的利益。故选项A正确。？"},{"k":1,"d":0,"s":"太平天国由盛转衰的转折点是（），","o":["金田起义","永安建制","《天朝田亩制度》的颁布","天京事变"],"a":3,"e":"此题考查学生对天京事变影响的掌握。1856年9月发生天京事变，东王杨秀清、北王韦昌辉先后被杀，翼王石达开率部出走后败亡。天京事变是太平天国由盛转衰转折点，大大削弱了太平天国的领导和军事力量，严重挫伤革命士气，造成严重危机。故D正确。"},{"k":1,"d":0,"s":"辛亥革命是在一片胜利的欢呼声中失败的，这里的欢呼主要来自（）。","o":["满族统治结束","武昌起义胜利","列强宣布“中立\"","中华民国建立"],"a":3,"e":"辛亥革命以后，孙中山在南京宣布就职，该国号为中华民国，成立中华民国临时政府。辛亥革命取得了巨大成功，但仍以失败告终。南京临时政府只存在了三个多月就天折了。北洋军阀首领袁世凯在帝国主义和国内反动势力以及附从革命的旧官僚、立宪派的共同支持下，窃取了辛亥革命的果实。胜利的欢呼主要来自中华民国的建立，但这声欢呼声是以辛亥革命的失败而告终的。因此答案是D。"},{"k":1,"d":0,"s":"中国工人运动第一次高潮起点的标志是（）","o":["安源路矿工人工","京汉铁路工人工","香港海员罢工","开滦煤矿工人黑工"],"a":2,"e":"中国共产党成立以后，集中力量领导工人运动，迅速掀起工人运动的第一次高潮。从时间上看，1922年1月发生的香港海员罢工是中国工人阶级第一次直接向帝国主义进行针锋相对斗争的罢工事件，是工人运动第一次高潮起点的标志。安源路矿工人罢工发生在1922年9月，开滦煤矿工人罢工发生在1922年10月，京汉铁路工人罢工则是1923年2月发生的，它们是第一次工人运动高潮的\"顶点”，而不是题目中所要求回答的“起点”。这三次罢工都比香港海员罢工要晚，不符合题目中要求的“起点的标志”。故C选项正确。"},{"k":1,"d":0,"s":"洪秀全登极称天王，是在（）","o":["武宣东乡","桂平县金田村","永安","南京"],"a":0,"e":"1851年1月，洪秀全率领拜上帝教教众在广西省桂平县金田村发动起义，建号太平天国，紧接着在东乡称王，在永安建制，最终攻破南京，改为天京作为都城，因此，正确答案A。"},{"k":1,"d":0,"s":"毛泽东指出：帝国主义列强侵略中国，在一方面促进中国封建社会解体，促使中国发生了资本主义因素，把一个封建社会变成了一个半封建的社会；但是在另一方面，它们又残酷地统治了中国，把一个独立的中国变成了一个半殖民地和殖民地的中国。”这说明（）。西方殖民主义的侵略在客观上会刺激落后国家资本主义的发展","o":["没有资本主义的侵略，我们将永远沉沦","殖民侵略虽然给中国带来了困难，但更重要的是带来了新的生产力和生产关系，打破了我国长期停滞落后的状况，对我国的发展起了","巨大的推动作用","资本-帝国主义侵略中国的目的，是企图把中国变成它的殖民地，把中国人民变成受它压迫奴役的奴隶"],"a":3,"e":"ABC选项存在错误，是典型的殖民主义言论，再分析题干可知，帝国主义侵略中国的后果和目的就是奴役中国人民。"},{"k":1,"d":0,"s":"第一次国共合作的形式是（）。","o":["党内合作","党外合作","政治协商","组织同盟"],"a":0,"e":"第一次国共合作采用党内合作形式，共产党以个人名义加入中国国民党。"},{"k":1,"d":1,"s":"属于大革命失败的最主要客观原因（）。","o":["反动力量过于强大","中共犯了右倾机会主义错误","马列主义影响不大","工农运动处于低潮"],"a":0,"e":"本题考查大革命失败的客观原因，B是主观原因，C不是最主要的，D是大革命失败的结果。"},{"k":1,"d":1,"s":"（）标志中国新民主主义革命开端。","o":["新文化运动","保路运动","五卅运动","五四运动"],"a":3,"e":"五四运动具有以辛亥革命为代表的旧民主主义革命所不具备的历史特点和历史意义，所以成为中国新民主主义革命的伟大开端。"},{"k":1,"d":0,"s":"北伐战争正式开始的标志是（）","o":["1925年7月国民政府的成立","1925年8月国民革命军的组建","1926年5月北伐先遣军进入湖南","1926年7月9日国民革命军举行誓师典礼"],"a":3,"e":"1926年7月9日国民革命军举行誓师典礼标志北伐战争开始。"},{"k":1,"d":0,"s":"中国近代史上第一个具有鲜明资本主义色彩的方案是（）。","o":["《海国图志》","《资政新篇》","《天朝田亩制度》","《变法通议》"],"a":1,"e":"《资政新篇》主张在政治、经济、思想文化、外交等方面学习西方，是带有鲜明的资本主义色彩的改革与建设方案。故B正确。"},{"k":1,"d":1,"s":"1940年，在枣宜会战中以身殉国的国民党爱国将领是（）","o":["张自忠","佟麟阁","赵登禹","谢晋元"],"a":0,"e":"1940年5月，在枣宜会战中，第三十三集团军总司令张自忠将军在激战中殉国。张自忠一一1940年5月一一枣宜会战；佟麟阁、赵登禹1937年北平南苑；谢晋元-1941年4月24日淞沪会战。"},{"k":1,"d":1,"s":"在手工业社会主义改造中建立的手工业供销合作社属于（）","o":["社会主义萌芽性质","资本主义性质","半社会主义性质","社会主义性质"],"a":2,"e":"手工业在社会主义改造中的第二个阶段是办手工业供销合作社。它是由供销组合并起来的，开始是统一供销业务，分别核算，生产活动仍由各户分散独立完成；后来逐步有部分生产资料是公有的，合作社对各户的生产也有一定的干预，因而具有半社会主义性质。故C选项正确。？"},{"k":1,"d":0,"s":"英国发动鸦片战争的主要意图是（）。","o":["保护鸦片贸易","割占中国领土","打开中国商品市场","争取外交礼仪平等"],"a":2,"e":"英国作为资本主义国家，迫切需要商品市场和原料产地，因此发动鸦片战争主要原因是意图是打开中国的市场。"},{"k":1,"d":0,"s":"中国的封建社会前后延续了（）。","o":["一千多年","二千多年","三千多年","四千多年"],"a":1,"e":"中国从公元前475年春秋战国时期进入封建社会。"},{"k":1,"d":0,"s":"五四运动后比较全面系统介绍马克思的学说的文章是李大钊所写的（）。","o":["《法俄革命之比较观》","《庶民的胜利》","《Bolshevism的胜利》","《我的马克思主义观》"],"a":3,"e":"1919年，李大钊发表了《新纪元》、《我的马克思主义观》、《再论问题与主义》等几十篇宣传马克思主义的文章。但比较全面系统介绍马克思主义的文章是《我的马克思主义观》，故选C。"},{"k":1,"d":0,"s":"中国封建社会的社会结构特点是（）","o":["领主制","族权制","市民社会制","族权和政权相结合的封建宗法等级制度"],"a":3,"e":"考察中国封建社会基本特征，其社会结构的特点是族权与政权结合的封建宗法制。"},{"k":1,"d":0,"s":"对“三民主义”中“民权主义”理解正确的是（）。","o":["推翻清王朝的封建专制统治","进行政治革命，推翻封建帝制，建立资产阶级共和国","平均地权、核定地价","打击帝国主义在华势力"],"a":1,"e":"民权主义的内容是“创立民国”，即推翻封建君主专制制度，建立资产阶级民主共和国。这就是孙中山所说的政治革命。"},{"k":1,"d":0,"s":"在中国率先举起马克思主义旗帜的是（）。","o":["陈独秀","李大钊","毛泽东","董必武"],"a":1,"e":"俄国社会主义革命的胜利极大地鼓舞和启发了李大钊，他以《新青年》和《每周评论》等为阵地，相继发表了《庶民的胜利》、《布尔什维主义的胜利》、《我的马克思主义观》等大量宣传十月革命和马克思列宁主义的著名文章和演说，成为中国共产主义的先驱、我国最早传播马克思主义的人。"},{"k":1,"d":0,"s":"彻底清算了大革命后期陈独秀的右倾机会主义错误是在（）","o":["中共六大","八七会议","遵义会议","中共七大"],"a":1,"e":"1927年8月7日中共中央在汉口召开紧急会议（即八七会议），会议彻底清算了大革命后期陈独秀右倾机会主义错误，确定了土地革命和武装斗争的方针，保证中国革命继续向前发展。故选项B正确。"},{"k":1,"d":0,"s":"中国人民抗日战争进入全民族抗战的新阶段是在（）","o":["卢沟桥事变爆发后","九一八事变爆发后","一二八事变爆发后","南京大屠杀以后"],"a":0,"e":"中国人民在九一八事变后开始的局部抗日战争，揭开了世界反法西斯战争的序幕。卢沟桥事变是中国全国性抗战的开始，中国在东方开辟了世界第一个大规模的反法西斯战场。"},{"k":1,"d":0,"s":"鸦片战争后，外国资本主义的入侵对中国经济的影响不包括（）。","o":["封建地主土地所有制迅速瓦解","自给自足的自然经济基础遭到破坏","卷入世界资本主义经济体系和世界市场之中","中国出现了资本主义生产关系"],"a":0,"e":"鸦片战争后，封建土地所有制并未解体，到1950年夏，政府颁布《中华人民共和国土地改革发》，废除封建地主剥削的土地所有制，实行农民阶级的土地所有制。1952底，除部分少数民族地区外，全国基本上完成了土地改革。封建地主剥削的土地所有制至此完全废除。"},{"k":1,"d":0,"s":"1935年，北平学生举行的抗日救亡运动是（）","o":["五四运动","五卅运动","一二·九运动","一二·三O运动"],"a":2,"e":"在中国共产党关于救亡图存、全民抗战的口号和中共地下党组织的领导下。1935年12月9日，北平学生举行声势浩大的抗日游行，喊出“反对华北自治”\"打倒日本帝国主义”、“停止内战，一致对外”等口号，遭到国民党军警镇压。这就是一二·九运动。"},{"k":1,"d":0,"s":"抗日战争由战略防御阶段转为战略相持阶段是在（）之后。","o":["淞沪会战","忻口会战","武汉会战","徐州会战"],"a":2,"e":"1938年日军占领广州、武汉后被迫停止对中国的战略进攻，实施“以华制华”和\"以战养战”策略。"},{"k":1,"d":0,"s":"1933年5月，国民党西北军将领冯玉祥在张家口成立的抗日武装力量是（","o":["东北抗日同盟军","东北抗日义勇军","察哈尔抗日义勇军","察哈尔抗日同盟军"],"a":3,"e":"1933年5月，原西北军将领冯玉祥在张家口成立察哈尔民众抗日同盟军，并谋求同共产党的合作。"},{"k":1,"d":0,"s":"第二次鸦片战争时期，侵占我国北方大量领土的国家是（）。","o":["日本","俄国","德国","英国"],"a":1,"e":"第二次鸦片战争最大的受益者实为沙俄，侵占中国150多万平方公里的领土。"},{"k":1,"d":0,"s":"1944年至1945年，日本在中国发动的最后一次大规模进攻是（）。","o":["枣宜会战","第二次长沙会战","豫湘桂战役","缅北滇西战役"],"a":2,"e":"枣宜会战是1940年四五月间，第二次长沙会战是1941年，豫湘桂战役是1944年12月，占领中国20多万平方公里的土地。"},{"k":1,"d":0,"s":"中共一大产生的中央局书记是（）","o":["毛泽东","张国焘","李达","陈独秀"],"a":3,"e":"中共一大选定陈独秀、李达、张国焘组成中央局，陈独秀为书记，张国焘为组织主任，李达为宣传主任。"},{"k":1,"d":0,"s":"对1927年后共产党领导的红军和根据地斗争经验的科学概括是（）","o":["坚持党的建设","农村包围城市、武装夺取政权","坚持以城市为中心向农村发展","坚持党对军队的领导"],"a":1,"e":"以农村为工作重点，到农村去发动农民，进行土地革命，开展武装斗争，建设根据地，这是1927年以后中国革命发展的客观规律所要求的。"},{"k":1,"d":0,"s":"大革命时期的农民运动与以往的农民运动相比，最本质的区别是（）。","o":["担负起了反帝任务","触及了封建土地所有制","把政治斗争和经济斗争相结合","有了先进阶级的领导"],"a":3,"e":"在大革命中，刚成立不久的中国共产党起着独特的、不可替代的作用。它是近代中国历史上空前广泛而深刻的群众运动，而中国共产党正是人民群众的主要发起者和组织者。以往的农民运动没有一个坚强的领导核心，是一盘散沙的运动。在大革命期间，中国共产党把一盘散沙的中国人民的力量组织，凝聚起来，使农民运动有了一个先进的，坚强的领导核心。因此，正确答案是D。"},{"k":1,"d":0,"s":"戊戌维新运动的政治主张是（）","o":["君主专制制度","资本主义的君主立宪制","人民民主专制","资产阶级共和国制度"],"a":1,"e":"维新变法的最主要的政治主张是仿照日本建立君主立宪政体的国家，故选B。"},{"k":1,"d":0,"s":"1922年7月，中国共产党第二次全国代表大会制定了（）。","o":["同中国国民党建立统一战线的策略","彻底的反帝反封建的民主革命纲领","坚持共产党领导权和巩固工农联盟的总方针","发动武装起义、开展土地革命的策略总方针"],"a":1,"e":"考察中共二大的内容，确立了最高纲领和最低纲领，其中最低纲领即提出彻底的反帝反封建的民主革命纲领。"},{"k":1,"d":0,"s":"戊戌变法具有爱国和进步意义，其爱国性主要表现在（）。","o":["挽救民族危亡","要求变革一些旧制度","与顽固派进行论战","要求发展资本主义"],"a":0,"e":"维新变法的意义之一就是它是一场爱国救亡的政治运动，爱国性主要体现在挽救民族危亡，改变中国社会的内忧外患。"},{"k":1,"d":0,"s":"万里长征是中国工农红军进行的伟大战略转移，这里的“转移”是指（）。","o":["中国革命的性质发生了变化","党的工作重心发生了转移","革命中心地区发生了转移","中国革命的任务发生了变化"],"a":2,"e":"考察红军长征胜利的意义，实现了革命中心地区的转移即由南方转向大西北。"},{"k":1,"d":0,"s":"资产阶级革命派同改良派论战的焦点是（）","o":["要不要实现“耕者有其田\"","要不要以革命手段推翻清政府","要不要推翻帝制，实现共和","要不要进行社会革命"],"a":1,"e":"资产阶级革命派与改良派论战主要是针对三个方面，分别是：要不要以革命手段推翻清政府；要不要推翻帝制，实行共和；要不要社会革命。其中论战的焦点集中在要不要以革命手段推翻清政府的统治上。"},{"k":1,"d":0,"s":"中国革命必须走农村包围城市最后夺取城市这样一条道路，主要取决于（）。","o":["中国农民人口多","中国革命的发展趋势","中国半殖民地半封建社会性质","敌人在农村力量薄弱"],"a":2,"e":"考察工农武装割据思想，毛泽东在《中国红色政权为什么能够存在》一文中指出工农武装割据道路最根本的原因是由中国社会性质决定的。"},{"k":1,"d":0,"s":"1930年1月，毛泽东进一步阐述农村包围城市、武装夺取政权理论的文章是（）。","o":["《星星之火，可以燎原》","《中国的红色政权为什么能够存在？》","《井冈山的斗争》","《中国革命战争的战略问题》"],"a":0,"e":"1930年1月，毛泽东在《星星之火，可以燎原》一文中，毛泽东进一步阐述农村包围城市、武装夺取政权理论"},{"k":1,"d":0,"s":"1935年12月，中国共产党确定抗日民族统一战线政策的会议是（）。","o":["晋绥干部会议","洛川会议","遵义会议","瓦窑堡会议"],"a":3,"e":"1935年1月15-17日遵义会议，改组了党中央领导机构，推选毛泽东为政治局常委，党内进行了再分工。1935年12月瓦窑堡会议提出了在抗日的条件下与民族资产阶级重建统一战线的新政策，批评了左倾冒险主义、关门主义。1937年8月洛川会议制定了抗日救国十大纲领。1938年4月1日晋绥干部会议批判了党内存在的右倾错误。"},{"k":1,"d":0,"s":"大革命高潮的起点是（）","o":["国民党一大","五卅运动","北伐战争","中山舰事件"],"a":1,"e":"1925年5月，以五卅运动为起点，掀起了全国范围的大革命高潮。"},{"k":1,"d":0,"s":"国民党在全国政权的建立是（）","o":["1927年4月12日蒋介石上海政变","国民党蒋介石集团4月18日就在南京成立了南京国民政府","1928年2月南京国民政府改组","1928年12月29日，张学良改易旗帜"],"a":3,"e":"1927年4月12日蒋介石上海政变，公开背叛大革命，并成立南京国民政府，28年2月宁汉合流，改组南京国民政府，1928年12月东北易帜，标志着国民党在全国统治的建立。"},{"k":1,"d":0,"s":"辛亥革命的失败，从根本上说是因为（）。","o":["没有提出彻底的反帝反封建的革命纲领","资本主义的建国方案在半殖民地半封建的中国是行不通的","不能充分发动和依靠人民群众","不能建立坚强的革命政党"],"a":1,"e":"资本主义的建国方案在半殖民地半封建社会的中国行不通是根本原因；A、C、D选项都是辛亥革命失败的原因，但不是根本原因。故B选项正确。"},{"k":1,"d":1,"s":"对资本主义工商业改造的必由之路是（）","o":["社会主义","国家资本主义","私人资本主义","合作社经济"],"a":1,"e":"毛泽东选集第五卷《改造资本主义工商业的必经之路》中指出：经过国家资本主义完成对私营工商业的社会主义改造是必经之路。答案为B。"},{"k":1,"d":0,"s":"中国共产党在土地革命时期对待富农的正确政策是（）。","o":["限制富农","打击富农","中立富农","保护富农"],"a":0,"e":"中国共产党在土地革命战争时期确立的土地改革路线是依靠贫雇农、团结中农、限制富农，保护中小工商业者，消灭地主阶级。"},{"k":1,"d":0,"s":"在义和团运动时期，八国联军总司令、德国元帅瓦德西向德皇威廉二世报告说：“中国的”好战精神，尚未完全丧失，可于此次‘拳民运动’中见之。”“故瓜分一事，实为下策。”这说明（）。","o":["中国人民的不畏强暴、敢与敌人血战到底的英雄气概，打击和教训了帝国主义者，使他们不敢为所欲为地瓜分中国","帝国主义列强之间的矛盾和相互制约使得帝国主义瓜分中国的阴谋破产","帝国主义到中国来是为了帮助中国发展资本主义进而成为其友邦","中国民族意识的觉醒打击和教训了帝国主义者，使他们不敢为所欲为地瓜分中国"],"a":0,"e":"考察帝国主义不能灭亡中国的根本原因是中国人民的反抗。"},{"k":1,"d":0,"s":"1894年，孙中山组建的近代中国第一个立誓“驱除虏，恢复中华，创立合众政府”的资产阶级革命团体是（）。","o":["中国同盟会","华兴会","保国会","兴中会"],"a":3,"e":"1894年11月，孙中山到檀香山组建了第一个资产阶级革命团体-兴中会，并立誓“驱除鞑虏，恢复中华，创立合众政府”。故D项正确。"},{"k":1,"d":0,"s":"抗战时，日本军国主义允许“中华民国”国号在关内占领区的存在，这里所谓的“中华民国”是指以（）为首的政府。","o":["袁世凯","蒋介石","汪精卫","溥仪"],"a":2,"e":"1938年12月，中国国民党副总裁汪精卫投降日本。1940年3月，汪精卫在南京成立伪\"中华民国国民政府”。在关内占领区，日本军国主义者允许“中华民国”国号的存在，但是，这些地区实质上仍然是日本的独占殖民地。"},{"k":1,"d":1,"s":"抗战胜利后，蒋介石三次电邀毛泽东去重庆谈判，其最主要原因是（）。","o":["广大人民要求实现和平民主","迫于国内外反对内战的舆论压力","内战准备工作尚未就绪","想借机诱使共产党交出政权"],"a":2,"e":"四个选项皆为原因，但最主要的还是蒋介石的内战准备工作尚未到位，需要赢取时间，所以邀请毛泽东谈判。1945年8月至10月，重庆谈判举行。"},{"k":1,"d":0,"s":"中国近代史的起点为（）。","o":["八国联军入侵中国","鸦片战争","中日甲午战争","辛亥革命"],"a":1,"e":"中国近代史的起点为1840年的鸦片战争。"},{"k":1,"d":0,"s":"《天朝田亩制度》和《资政新篇》分别是太平天国早期和后期提出的社会改革方案，其共同点是（）。","o":["都具有反封建的进步性","都有利于中国资本主义的发展","都主张学习西方先进制度","都代表了近代中国社会发展方向"],"a":0,"e":"《天朝田亩制度》确立了平均分配土地的方案，《资政新篇》主张发展资本主义，它们都具有反封建的进步性。B、C项是《资政新篇》的意义和主张。D说法错误。"},{"k":1,"d":0,"s":"近代中国，中国资产阶级领导的变法与革命失败的根本原因是（）","o":["传统儒家思想的影响","封建顽固势力的强大","帝国主义的破坏","民族资产阶级自身的软弱性和妥协性"],"a":3,"e":"注意题干中的“根本原因”，所以答案为D。其他几个选项也都是原因，但不是最根本的。？"},{"k":1,"d":1,"s":"1948年1月，在香港正式宣布成立的中国民主党派是（）","o":["中国国民党革命委员会","中国民主促进会","台湾民主自治同盟","中国民主同盟"],"a":0,"e":"中国国民党革命委员会创建于1948年1月1日"},{"k":1,"d":1,"s":"解放区军民粉碎国民党军队的重点进攻是在（）","o":["1947年5月","1947年6月","1947年7月","1947年8月"],"a":1,"e":"从1947年3月至6月，解放军经过4个月的内线作战，努力打退陕甘宁边区、山东解放区国民党军的重点进攻，并在东北、热河、冀东、豫南等地开始局部反攻。"},{"k":2,"d":0,"s":"1947年10月10日，《中国人民解放军宣言》提出的口号是（）","o":["和平、民主、团结","向北发展、向南防御","打倒蒋介石，解放全中国","将革命进行到底"],"a":2,"e":"1947年10月10日，中国人民解放军总部发表宣言，正式提出“打倒蒋介石，解放全中国”的行动口号。这个口号的提出，极大地鼓舞了解放军全体指战员和全国人民的斗志。"},{"k":2,"d":0,"s":"十一届三中全会之后，关于是否在农村实行家庭联产承包责任制的问题上存在很大争议，对这一问题，邓小平一锤定音：“有的同志担心，这样搞会不会影响集体经济。我看这种担心是不必要的。”促使邓小平下定决心进行家庭联产承包责任制的根本原因是","o":["小农经济的落后性阻碍了生产的发展","农民仍被封建土地制度所束缚","人民公社与分配中的平均主义阻碍了生产的发展","促进市场经济的发展"],"a":2,"e":"本题考查家庭联产承包责任制。实质上生产关系的变革，原有的生产关系不适用生产力的发展，原有的人民公社与分配中的平均主义，挫伤农民的生产积极性，农业生产遭到破坏，所以要促进农业发展，必须变革生产关系。A讲的是小农经济的落后性，根本原因是体制的问题；B是错误的，此时的土地制度仍然是人民公社体制下的集体所有制；邓小平在20世纪90年代才提出“社会主义也可以搞市场”的思想，故D错。"},{"k":2,"d":0,"s":"中国共产党在过渡时期总路线的主体是实现（）。","o":["社会主义工业化","对农业的社会主义改造","对手工业的社会主义改造","对资本主义工商业的社会主义改造"],"a":0,"e":"过渡时期总路线包括一化三改，其中实现社会主义工业化是主体。"},{"k":2,"d":0,"s":"我国农业社会主义改造过程中，建立的农业互助组的性质是（）","o":["新民主主义性质","社会主义萌芽性质","半社会主义性质","完全社会主义性质"],"a":1,"e":"本题考查农业互助组的性质。新民主主义社会不是一个独立的社会形态，因此也就不存在具有新民主主义性质的社会生产组织，所以A最先被排除；农业的社会主义改造过程中出现了三种过渡形式，即互助组、初级农业合作社和高级农业合作社，其中初级社是半社会主义性质的，高级社是完全社会主义性质的，只有互助组是社会主义萌芽性质的。故B选项正确。？"},{"k":2,"d":0,"s":"全国范围内农业税的最终取消在（）","o":["2004年","2005年","2006年","2007年"],"a":2,"e":"中共十六届五中全会提出了建设社会主义新农村的战略任务，提出了“生产发展、生活宽裕、乡风文明、村容整洁、管理民主”的要求。2006年，在全国范围内取消农业税，为农民减轻税费负担1200亿元。答案为C"},{"k":2,"d":0,"s":"1950年6月，毛泽东在七届三中全会上做了书面报告，指出党在这一时期的中心任务是，要在三年左右的时间内（）","o":["国家机构所需经费的大量节减","合理调整现有工商业","完成土地革命","争取国家财政经济状况的基本好转"],"a":3,"e":"本题考查七届三中全会的中心任务。毛泽东在会上做了《为争取国家财政经济状况的基本好转而斗争》，并分析了国际国内形势，提出党在国民经济恢复时期的中心任务是争取国家财政经济状况的基本好转。国家机构所需经费的大量节减、对现有工商业的合理调整、土地改革的完成是为了完成“国家财政经济状况基本好转”的三个条件。"},{"k":2,"d":0,"s":"标志着近代以来中国争取民族独立和人民解放的历史任务基本完成的是（）","o":["抗日战争取得胜利","辽沈、淮海、平津三大战役的胜利","人民民主专政的新中国的创立","中共七届二中全会的胜利召开"],"a":2,"e":"本题考查中国革命的胜利。人民民主专政的新中国的成立，标志着近代以来中国面临的争取民族独立、人民解放这个历史任务的基本完成，这就为中国人民集中力量进行建设，以实现国家的繁荣富强和人民的共同富裕，创造了前提，开辟了道路。A选项彻底打败日本侵略者，但美蒋政权正图谋反共，准备内战，并没有完成两大历史任务，B选项标志着国民党赖以维持其反动统治的主要军事力量基本上被摧毁，并不是完全覆灭，D选项是在中国新民主主义革命即将取得全国胜利的历史转折关头的一次重要的会议，当时的国民党反动统治并没有完全覆灭。"},{"k":2,"d":0,"s":"1977年到1978年中国的国民经济比例严重失调，有人甚至指出：\"整个国民经济几乎到了崩溃的边缘”，为了解决这个困难，中共中央工作会议提出对国民经济实行的方针是（）","o":["调整、巩固、充实、提高","实现速度、结构、效益、质量的统一","调整、改革、整顿、提高","公私兼顾、劳资两利、城乡互助、内外交流"],"a":1,"e":"本题考查国民经济的调整。1979年4月5日，中共中央召开工作会议，主要讨论国民经济问题，调整的主要任务是，压缩基本建设规模，调整国民经济重大比例关系，集中力量先把农业搞上去。李先念提出“调整、改革、整顿、提高”的八字方针。A是中共八届九中全会提出的对国民经济的调整方针；B是党的十六大提出的经济工作的指导方针；D是中共七届二中全会后，党制定的新民主主义经济建设的方针。"},{"k":2,"d":0,"s":"（）是中国特色社会主义的本质要求和重要保障。","o":["全面依法治国","全面从严治党","全面发展经济","全面可持续发展"],"a":0,"e":"党的十九大报告指出，全面依法治国是中国特色社会主义的本质要求和重要保障，是国家治理的一场深刻革命，必须坚持厉行法治，推进科学立法、严格执法、公正司法、全民守法。"},{"k":2,"d":0,"s":"新中国第一颗氢弹试验成功是在（）","o":["1964年10月","1966年10月","1967年6月","1970年4月"],"a":2,"e":"1967年6月17日，我国第一颗氢弹试验成功，1964年10月第一颗原子弹炮炸成功。"},{"k":2,"d":0,"s":"我国对资本主义工商业进行社会主义改造实行的政策是（）。","o":["无偿没收","有偿征用","和平赎买","公私联营"],"a":2,"e":"我国对资本主义工商业进行社会主义改造实行的是赎买政策，这也是结合我国国情实行的特殊政策。"},{"k":2,"d":0,"s":"新中国成立初期，确立社会主义国营经济的领导地位主要是通过（）","o":["没收官僚资本","原解放区的公营经济?","对美、英等国在中国大陆留下的企业，分别采取管制、征购、代用、代管等措施，逐步收归国有","买民族资产阶级的财产"],"a":0,"e":"新中国成立之前，以四大家族为代表的官像资本是中国资本主义经济的主体，居于垄断地位，没收官僚资本归人民的国家所有，是《共同纲领》规定的一项历史任务。因此，把官僚资本企业收归国家所有，便成为建立社会主义国营经济的主要途径，由此可以牢牢掌握国家的经济命脉，为建立和巩固社会主义制度准备条件，奠定基础。？"},{"k":2,"d":0,"s":"中国共产党第十八次全国代表大会阐明中国特色社会主义的总依据是（）。","o":["社会主义初级阶段","社会主义社会","新民主主义","共产主义"],"a":0,"e":"2012年11月8日至14日，中国共产党第十八次全国代表大会在北京召开．十八大强调：建设中国特色社会主义，总依据是社会主义初级阶段，总布局是社会主义经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体，总任务是实现社会主义现代化和中华民族伟大复"},{"k":2,"d":0,"s":"为反对国民党的暴虐统治，抗击反动军警屠杀市民，台湾人民在1947年举行了（）","o":["黑旗军起义","抗暴行运动","二二八起义","五二O运动"],"a":2,"e":"1947年2月28日，台湾省台北市人民举行大规模示威游行。2月底3月初，台湾各地汉族、高山族人民纷纷响应。3月14日起义失败。二二八起义虽然失败了，但作为全国人民民主运动的组成部分，它有力地显示了台湾人民的革命精神，鼓舞了全国人民。"},{"k":2,"d":0,"s":"从全面建成小康社会到基本实现现代化，再到全面建成（），是新时代中国特色社会主义发展的战略安排。","o":["创新型国家","社会主义现代化强国","社会主义现代化大国","世界一流强国"],"a":1,"e":"党的十九大报告指出，从全面建成小康社会到基本实现现代化，再到全面建成社会主义现代化强国，是新时代中国特色社会主义发展的战略安排。"},{"k":2,"d":0,"s":"1956年9月15日至27日，中国共产党第八次全国代表大会在北京举行，中共八大通过的政治报告指出，党和全国人民的中心任务是（）","o":["调动一切积极因素，为社会主义事业服务","正确处理人民内部矛盾，巩固社会主义制度","集中力量发展生产力，建设社会主义现代化强国","加强和改进党的建设，巩固党的执政地位"],"a":2,"e":"本题考查中共八大提出的关于党的中心任务。1956年中共八大关于政治报告的决议指出：为了把我国从落后的农业国发展为先进的工业国，必须首先推翻束缚生产了发展的半封建半殖民地的政治制度和经济制度。即党的根本任务就是在新的生产关系的下保护和发展生产力。A是实现集中力量发展生产力的基本方针；B是为了更好的完成党的这个中心任务；D是完成这个中心任务的根本保证。"},{"k":2,"d":0,"s":"《论十大关系》的发表标志着（）","o":["中国共产党人开始探索自己的社会主义建设道路","社会主义改造的完成","新民主主义国家的建立","阶级矛盾的消除"],"a":0,"e":"《论十大关系》是以毛泽东为主要代表的中国共产党人开始探索中国自己的社会主义建设道路的标志。答案为A。"},{"k":2,"d":0,"s":"对资本主义工商业实行社会主义改造、使资本主义所有制过渡到社会主义公有制具有决定意义的重大步骤是（）","o":["委托加工","个别企业的公私合营","全行业的公私合营","计划订货"],"a":2,"e":"本题考查考生对全行业公私合营意义的掌握。全行业公私合营不同于原来的私营企业，具有不同程度的社会主义性质，这样全行业公私合营成为对资本主义工商业实行社会主义改造，使资本主义所有制过渡到社会主义公有制的具有决定意义的重大步骤。故选项C正确。"},{"k":2,"d":0,"s":"党的十九大报告指出：（）是发展的根本目的。","o":["加强民主政治建设","坚持依法治国","增进民生福社","缩小贫富差距"],"a":2,"e":"十九大报告指出：坚持在发展中保障和改善民生，增进民生福是发展的根本目的。"},{"k":2,"d":0,"s":"1956年，中共中央召开关于知识分子问题的会议，动员全党和全国人民特别是广大知识分子“向现代科学进军”，周恩来指出知识分子中的绝大部分已经是（）","o":["资产阶级知识分子","小资产阶级知识分子","工人阶级知识分子","领导阶级"],"a":2,"e":"本题考查知识分子的问题。周恩来指出，知识分子中间的绝大部分已经是工人阶级的一部分，有计划的帮助他们在政治上和业务上不断进步是党和国家的极其重要的任务。在新民主主义革命时期，毛泽东将知识分子归入小资产阶级范畴，小资产阶级不同于资产阶级，而是属于劳动者的范畴，故AB错误，领导阶级是工人阶级及其先锋队，故D错误。"},{"k":2,"d":0,"s":"新时代中国特色社会主义文化建设有必要与（）结合起来，在共同价值的基础上呈现现实形态。","o":["在对外开放和国际战略上更加积极作为","构建人类命运共同体的倡议","坚持以人民为中心的发展思想","坚持新发展理念，促进人的全面发展"],"a":1,"e":"十九大报告指出，新时代中国特色社会主义文化建设要与构建人类命运共同体的倡议结合起来，在共同价值的基础上呈现其现实形态。"},{"k":2,"d":0,"s":"2004年9月，中共十六届四中全会提出的战略任务是（）。","o":["构建社会主义和谐社会","全面建设小康社会","建设社会主义新农村","建立社会主义市场经济体制"],"a":0,"e":"A项是2004年9月，中共十六届四中全会提出构建社会主义和谐社会的战略任务；B项是2002年11月中共十六大在北京召开，报告明确了全面建设小康社会的奋斗目标；C项是2005年10月召开了中央十六届五中全会，提出了建设社会主义新农村的战略任务；D项1992年中共十四大提出我国经济体制改革目标是建立社会主义市场经济体制。"},{"k":2,"d":0,"s":"1951年底到1952年春，中国共产党在党政机构工作人员中开展了（）。","o":["肃反运动","整风、整党运动","\"三反”运动","\"五反”运动"],"a":2,"e":"为警惕资产阶级糖衣炮弹的袭击，在党政机构工作人员中开展反贪污、反浪费、反官僚主义的三反运动。"},{"k":2,"d":0,"s":"1988年，中共中央和国务院决定建立的经济特区是（）。","o":["深圳经济特区","珠海经济特区","厦门经济特区","海南经济特区"],"a":3,"e":"省，将海南岛辟为经济特区。答案为D。"},{"k":2,"d":0,"s":"明确提出全面建成小康社会的奋斗目标是（）","o":["中共十五大","中共十六大","中共十七大","中共十八大"],"a":3,"e":"党的十八大明确提出全面建成小康社会的奋斗目标。"},{"k":2,"d":0,"s":"中共十二届三中全会通过《关于经济体制改革的决定》，标志着经济体制改革（）。","o":["以农村为重点展开","以城市为重点全面展开","以国有企业的改革为重点展开","以管理体制的改革为重点展开"],"a":1,"e":"1984年10月，中共十二届三中全会通过了《关于经济体制改革的决定》。《决定》的作出和实施，使经济体制改革以城市为重点全面展开，在一些方面取得了重要进展。答案为B。"},{"k":2,"d":0,"s":"1962年9月召开的中共八届十中全会进一步发展了（）","o":["社会主义经济理论","\"以阶级斗争为纲”的理论","无产阶级革命理论","实现现代化的理论"],"a":1,"e":"1962年9月，召开了中共八届十中全会。全会公报根据毛泽东多次讲话精神，进一步发展了“以阶级斗争为纲”的理论。答案为B。"},{"k":2,"d":0,"s":"1962年初，中共中央召开的扩大的中央工作会议是（）","o":["\"七千人大会\"","庐山会议","南宁会议","武昌会议"],"a":0,"e":"1962年1月，中央在北京召开了扩大的工作会议。人们习惯地称这次会议为“七千人大会”。这是我们党在执政后召开的一次空前规模的总结认识和纠正工作中发生的“左”的错误，起了积极作用。"},{"k":2,"d":0,"s":"1959年，在中共中央召开的庐山会议上受到错误批判的是（）","o":["刘少奇","彭德怀","周恩来","邓小平"],"a":1,"e":"1959年在庐山会议召开期间彭德怀给毛泽东写信提了意见，错被认为“万言书”，打成右派。答案为B。"},{"k":2,"d":0,"s":"新中国恢复在联合国合法席位的时间是（）","o":["1949年","1966年","1971年","1978年"],"a":2,"e":"1971年第26界联合国大会恢复了中华人民共和国的合法席位。答案为C。"},{"k":2,"d":0,"s":"我国对个体农业社会主义改造坚持的原则是（）。","o":["自愿和互利","动员和鼓励","示范和推广","发展和巩固"],"a":0,"e":"考察对个体农业改造的原则，实行自愿互利的原则。"},{"k":2,"d":0,"s":"中国经济在20世纪50年代的最重要事件是（）","o":["选择了社会主义","建立了国营经济","土地改革完成","第一个五年计划的实施"],"a":0,"e":"20世纪50年代在经济领域做出的重要政策即进行社会主义革命，通过一五计划和三大改造完成了社会主义革命，使中国选择了社会主义。"},{"k":2,"d":0,"s":"揭开我国社会主义改革开放序幕的会议是（）","o":["中共十一届三中全会","中共十一届六中全会","中共十二届三中全会","中共十二届六中全会"],"a":0,"e":"中共十一届三中全会是新中国成立以来党的历史上具有深远意义的伟大转折。它揭开了社会主义改革开放的序幕。以这次全会为起点，中国进入了改革开放和社会主义现代化建设的历史新时期。答案为A。"},{"k":2,"d":0,"s":"中国加入世界贸易组织的时间是（）","o":["1999年12月","2000年12月","2001年12月","2002年12月"],"a":2,"e":"2001年12月11日，中国正式加入世界贸易组织，成为其第143个成员。"},{"k":2,"d":0,"s":"中共十三大完整概括了共产党在社会主义初级阶段的基本路线是（）","o":["\"一个中心，两个基本点\"","多快好省，力争上游","艰苦奋斗建设社会主义","\"一化三改\""],"a":0,"e":"中国共产党第十三次全国代表大会比较系统地阐述了关于社会主义初级阶段的理论，完整地概括了中国共产党在社会主义初级阶段“一个中心、两个基本点”的基本路线，制定了下一步经济体制改革和政治体制改革的基本任务和奋斗目标。答案为A。"},{"k":2,"d":0,"s":"党的十一届三中全会之所以在党的历史上是具有深远意义的伟大转折，最根本的一点就是（）","o":["确立了实事求是的思想","果断停止了“以阶级斗争为纲”的错误方针","做出了改革开放的伟大决策","决定纠正重大冤假错案"],"a":1,"e":"本题考查十一届三中全会。党的八大确定了经济建设的方针，此后阶级斗争不断扩大，结果导致文化大革命，党的十一届三中全会停止以阶级斗争为纲的错误方针，做出了改革开放的伟大决策。AD是会议的中心议题，但是影响并没有果断停止以阶级斗争为纲的错误方针影响深远;C具有迷惑性，考生要了解其与B的逻辑关系，只有停止以阶级斗争为纲的错误方针才可以进行改革开放。"},{"k":2,"d":0,"s":"1981年6月，中共十一届六中全会通过《关于建国以来党的若干历史问题的决议》，标志着指导思想上的拔乱反正的胜利完成,其核心问题是（）","o":["提出了四项基本原则","首次提出“建设具有中国特色的社会主义”的命题","比较系统的阐述了关于社会主义初级阶段的理论","科学的评价了毛泽东的历史功过、确立毛泽东思想的指导地位"],"a":3,"e":"本题考查《关于建国以来党的若干历史问题的决议》。其中最核心的内容就是科学的概括了毛泽东思想的科学内涵，科学的评价了毛泽东的历史地位以及毛泽东思想的历史地位。1979年的理论工作务虚会上提出四项基本原则，故A错；B是在十二大首次提出的；十三大比较系统的阐述了关于社会主义初级阶段的理论。"},{"k":2,"d":0,"s":"制定和通过了彻底实行土地改革的《中国土地法大纲》的是（）","o":["全国土地会议","中共七大","晋绥干部会议","中共七届二中全会"],"a":0,"e":"在人民解放军转入战略进攻之后，为了维护广大农民的利益、进一步激发他们支援解放战争的积极性，1947年7月至9月，中国共产党在河北省平山县召开全国土地会议，制定和通过了《中国土地法大纲》，明确规定“废除封建性及半封建性剥削的土地制度，实现耕者有其田的土地制度”，“乡村中一切地主的土地及公地，由乡村农会接收”，分配给无地或少地的农民。"},{"k":2,"d":0,"s":"中华人民共和国成立后，中国社会开始了（）。","o":["众旧民主主义白新民主主义的过渡","从资本主义向社会主义的过渡","从新民主主义向社会主义的过渡","从社会主义向共产主义的过渡"],"a":2,"e":"新中国的成立，标志着中国进入新民主主义社会，经过三大改造之后，我国进入社会主义社会。因此，新中国成立后，中国社会开始了从新民主主义向社会主义的过渡。"},{"k":2,"d":0,"s":"邓小平指出实现四个现代化的根本前提是（）","o":["坚持共产党领导","坚持社会主义制度","坚持改革开放","坚持四项基本原则"],"a":3,"e":"1979年3月30日，邓小平在理论工作务虚会上发表的讲话中指出：坚持社会主义道路，坚持人民民主专政，坚持共产党的领导，坚持马克思列宁主义、毛泽东思想这四项基本原则“是实现四个现代化的根本前提”。答案为D。"},{"k":2,"d":0,"s":"，中国进入新民主主义社会后,经济上处于领导地位的是（）","o":["私人资本主义经济","社会主义国营经济","合作社会经济","农民和手工业者的个体经济"],"a":1,"e":"新民主主义社会存在五种经济成分，其中处于领导地位的是国营经济。？"},{"k":2,"d":0,"s":"实际上成为1978年以来拔乱反正的预演的是（）","o":["“天安门事件\"","实践是检验真理标准问题的讨论?","\"二月抗争\"","1975年的整顿"],"a":3,"e":"本题为基本史实和基本知识记忆题。1975年邓小平复出整顿，调整经济，对部分干部实行保护，实际为拔乱反正的预演。"},{"k":2,"d":0,"s":"中国共产党第十五次全国代表大会的主题是（）","o":["明确国家经济体制改革的目标是建立社会主义市场经济体制","系统地阐述了关于社会主义初级阶段的理论","指导思想上拨乱反正的胜利完成","高举邓小平理论伟大旗帜，把建设有中国特色社会主义事业全面推向二十一世纪"],"a":3,"e":"本题考查十五大的主要内容，属于记忆型题目，考生需记忆。"},{"k":2,"d":0,"s":"中国进入到新民主主义社会后的国内主要矛盾是（）。","o":["农民阶级和地主阶级的矛盾","工人阶级和资产阶级的矛盾","人民大众和封建主义的矛盾","人民大众和资本主义的矛盾"],"a":1,"e":"中国进入到新民主主义社会后的国内主要矛盾由中华民族和外国帝国主义的矛盾变成工人阶级与资产阶级的矛盾，因此进行三大改造的社会主义革命就是为了解决这一矛盾。"},{"k":2,"d":0,"s":"5万里长征是中国工农红军进行的伟大战略转移，这里的“转移”是指（）。中国革命的性质发生了变化","o":["党的工作重心发生了转移","革命中心地区发生了转移","中国革命的任务发生了变化","目："],"a":1,"e":"考察红军长征胜利的意义，实现了革命中心地区的转移即由南方转向大西北。"},{"k":2,"d":0,"s":"继延安整风之后又一场马克思主义思想解放运动是 中央的决策和部署，刘伯承、邓小平率晋冀鲁豫野战军跃进大别山；陈毅、粟裕率华东野战军挺进苏鲁豫皖地区；陈、谢富治率晋冀鲁豫野战军一部挺进豫西。三路大军相互策应，机动歼敌。人民解放战争战略进攻的序幕由此拉开。"},{"k":2,"d":0,"s":"最早完成全行业公私合营的城市是（）","o":["北京市","天津市","上海市","武汉市"],"a":0,"e":"最早完成全行业公私合营的城市是北京市。"},{"k":2,"d":0,"s":"1957年4月27日，中共中央下发《关于整风运动的指示》指出：“由于当在全国范围内处于执政地位，有必要在全党进行一次整风运动。”这次整风运动的主要内容是（）","o":["反对主观主义、宗派主义、党八股","反贪污、反浪费、反官僚主义","反对党内走资本主义的当权派","反对官僚主义、宗派主义、主观主义"],"a":3,"e":"本题考查整风运动。A选项是20世纪40年代延安整风运动的主要内容；B是1951年底到1952年初，中国共产党在党政机关开展的“三反”运动，C是1964年底到1965年1月“四清运动”的重点。"},{"k":2,"d":0,"s":"近代中国曾经出现过三种建国方案，其中中间派声称自己要“以民主的方法争取民主，以合法的手段争取合法的地位”，中间党派的这一主张的实质是（）","o":["代表着中产阶级的想法","半殖民半封建社会的道路","走和平的改良的道路","旧民主主义的道路"],"a":3,"e":"本题考查中间路线实质。抗日战争胜利之后，某些民主党派的领导人物曾经鼓吹“中间路线”，究其实质，走中间路线所倡导的就是资产阶级共和国的方案，他们所主张的，实质上就是旧民主主义的道路。A选项讲的是中间路线的阶级代表，B选项讲的是代表地主阶级和买办性的大资产阶级利益的国民党统治集团的政治主张，C选项讲的是“中间路线”鼓吹者在“实行的方法”方面的主张，其实质是走旧民主主义道路。"},{"k":2,"d":0,"s":"1956年，在中国进入全面建设社会主义时期的重大历史关头，党的（）第一次明确提出并阐释“我们国内的主要矛盾\"","o":["八大","十二大","一大","十四大"],"a":0,"e":"党的八大第一次指出我国的主要矛盾已经变成人们对于先进的工业国的需求同落后的农业国现实之间的矛盾。"},{"k":2,"d":0,"s":"中共十八大精神归结到一点，就是（）。","o":["坚持改革开放","坚持和发展中国特色社会主义","坚持以人民为中心","坚决打好决胜全面小康三大攻坚战"],"a":1,"e":"在十八大中，习近平指出，党的十八大精神，归结为一点，就是坚持和发展中国特色社会主义；并且指出，邓小平同志开创了中国特色社会主义，江泽民、胡锦涛等领导发展了中国特色社会主义。"},{"k":2,"d":0,"s":"新中国成立之初，民主革命的遗留任务依然存在，在这个时期具有民主革命性质的事件是（）","o":["土地改革","公私合营","供销合作化","大跃进"],"a":0,"e":"本题考查对民主革命性质的理解。土地改革是为了调动农民阶级的积极性，把他们从封建地主阶级的统治下解放出来，具有民主革命的性质B、C都属于社会主义革命性质的事件；D是社会主义建设性质的事件。"},{"k":2,"d":0,"s":"1956年4月，毛泽东在《论十大关系》中，指出：“提出这十个问题，都是围绕着一个基本方针”，毛泽东提出的这个“基本方针\"是（）","o":["调整、巩固、充实、提高","在综合平衡中稳步前进","鼓足干劲、力争上游、多快好省的建设社会主义","要把国内外的一切积极因素调动起来"],"a":3,"e":"本题考查《论十大关系》。这一基本方针是\"一定要努力把党内党外、国内国外的一切积极因素，直接的、间接地积极因素，全部调动起来，把我国建设成一个强大的社会主义国家。”A是中共八届九中全会提出的对国民经济进行调整的方针；B是中共八大前由周恩来、刘少奇提出，并在中共八大上被确立为经济建设的指导方针；C是1958年5月，在北京召开的八大二次会议根据毛泽东的创意，通过的总路线。"},{"k":2,"d":0,"s":"毛泽东指出，在社会主义建设中发展国民经济的顺序为（）。","o":["重、轻、农","农、轻、重","轻、农、重","轻、重、农"],"a":1,"e":"毛泽东提出，在社会主义建设中，要正确处理重工业、轻工业和农业的关系，以农、轻、重为序发展国民经济。故答案为B。"},{"k":2,"d":0,"s":"抗日战争胜利后，国共双方通过重庆谈判签订《政府与中共代表会谈纪要》的时间是（）。","o":["1945年8月","1945年9月","1945年 function h32(s){var h=5381,i;for(i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0;}
 return (h>>>0).toString(36);}
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}
 catch(e){return d;}}
function save(k,v){if(!storeOK)return;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shuffle(a){var i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));
 t=a[i];a[i]=a[j];a[j]=t;}return a;}

var B64='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function b64e(s){var o='',i=0,a,b,c;
  while(i<s.length){a=s.charCodeAt(i++)&255;
    b=i<s.length?s.charCodeAt(i++)&255:NaN;
    c=i<s.length?s.charCodeAt(i++)&255:NaN;
    o+=B64.charAt(a>>2);
    o+=B64.charAt(((a&3)<<4)|(isNaN(b)?0:b>>4));
    o+=isNaN(b)?'=':B64.charAt(((b&15)<<2)|(isNaN(c)?0:c>>6));
    o+=isNaN(c)?'=':B64.charAt(c&63);}
  return o;}
function b64d(s){var v=[],i,x;
  for(i=0;i<s.length;i++){x=B64.indexOf(s.charAt(i));if(x>=0)v.push(x);}
  var o='';
  for(i=0;i+1<v.length;i+=4){
    o+=String.fromCharCode((v[i]<<2)|(v[i+1]>>4));
    if(i+2<v.length)o+=String.fromCharCode(((v[i+1]&15)<<4)|(v[i+2]>>2));
    if(i+3<v.length)o+=String.fromCharCode(((v[i+2]&3)<<6)|v[i+3]);}
  return o;}
function exportCode(){
  var w=[],k;
  for(k in W){if(byId[k])w.push((byId[k].n-1)+':'+(W[k].c||1));}
  return 'QZ1|'+b64e(SEQ.i+','+STAT.ans+','+STAT.ok+','+w.length+','+w.join(','));
}
function importCode(code){
  code=(code||'').replace(/\s/g,'');
  if(code.indexOf('QZ1|')!==0)throw new Error('格式不对');
  var p=b64d(code.slice(4)).split(',');
  if(p.length<4)throw new Error('内容不完整');
  var i=parseInt(p[0],10)||0, ans=parseInt(p[1],10)||0, ok=parseInt(p[2],10)||0;
  var n=parseInt(p[3],10)||0, w2={}, got=0, j, ab;
  for(j=4;j<p.length;j++){
    if(!p[j])continue;
    ab=p[j].split(':');
    var idx=parseInt(ab[0],10);
    if(isNaN(idx)||!BANK[idx])throw new Error('第 '+(j-3)+' 条错题记录越界');
    w2[BANK[idx].id]={c:parseInt(ab[1],10)||1,t:0};
    got++;
  }
  if(got!==n)throw new Error('错题条数对不上（应有 '+n+' 条，实际 '+got+' 条）');
  return {seq:i,ans:ans,ok:ok,w:w2};
}
function copyFrom(id){
  var ta=document.getElementById(id);
  if(!ta)return;
  try{ta.focus();ta.select();}catch(e){}
  var done=false;
  try{done=document.execCommand('copy');}catch(e){}
  if(done){toast('已复制到剪贴板');return;}
  if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(function(){toast('已复制到剪贴板');},
      function(){toast('请长按上面的文字手动全选复制');});
    return;
  }
  toast('请长按上面的文字手动全选复制');
}
function doExport(){
  var code=exportCode();
  modal({title:'进度存档码',
    body:'<p>下面这段就是你的全部进度（进度位置、正确率、'+wrongIds().length
      +' 道错题）。<b>存到备忘录</b>里，下次打开本页粘贴回来即可恢复。</p>',
    html:'<textarea class="ovta" id="ovta" readonly>'+esc(code)+'</textarea>',
    okText:'复制',cancelText:'关闭',

}
function doImport(quiet){
  modal({title:'粘贴进度码',
    body:'<p>把之前保存的进度码整段粘贴到下面。这会<b>覆盖</b>当前的进度和错题本。</p>',
    html:'<textarea class="ovta" id="ovta" placeholder="QZ1|..."></textarea>',

        W=d.w;STAT={ans:d.ans,ok:d.ok};SEQ={i:d.seq};

    }});

function pick(k){
  var id=S.list[S.i],q=byId[id];
  if(S.pick[id]!==undefined)return;
  S.pick[id]=k;
  var ok=(k===q.a);
  STAT.ans++; if(ok)STAT.ok++; saveStat();
  if(ok){
    if(W[id]){delete W[id];saveW();}
  }else{
    W[id]={c:(W[id]?W[id].c:0)+1,t:Date.now()};saveW();
  }
  if(S.type==='seq'){SEQ.i=S.i;save(K_S,SEQ);}
  sessionAnswered++;
  if(!storeOK&&!reminded&&sessionAnswered>=5){
    reminded=true;
    toast('提示：本次进度不会自动保存，记得点底部按钮存进度码');
  }
  PENDING='fb';
  renderQuiz();
}
function go(d){
  var n=S.i+d;
  if(n<0||n>=S.list.length)return;
  PENDING='top';
  S.i=n;
  if(S.type==='seq'){SEQ.i=n;save(K_S,SEQ);}
  renderQuiz();
}
function jump(){
  modal({title:'跳转',body:'<p>要跳到第几题？（共 '+S.list.length+' 题）</p>',
    input:true,type:'number',value:''+(S.i+1),placeholder:'1 - '+S.list.length,
    onOk:function(v){
      var n=parseInt(v,10);
      if(isNaN(n)||n<1||n>S.list.length){
        toast('请输入 1 到 '+S.list.length+' 之间的数字');return false;}
      PENDING='top';
      S.i=n-1;
      if(S.type==='seq'){SEQ.i=S.i;save(K_S,SEQ);}
      renderQuiz();}});
}
function finishQuiz(){
  var un=0,i;
  for(i=0;i<S.list.length;i++){if(S.pick[S.list[i]]===undefined)un++;}
  if(un){
    ask('确认交卷','还有 <b>'+un+'</b> 题没有作答，确定现在交卷吗？','交卷',function(){
      renderResult();});
    return;
  }
  renderResult();
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='home'){home();return;}
  if(act==='seq'){startSeq();return;}
  if(act==='rand'){startRandom();return;}
  if(act==='wrong'){S=null;renderWrong();return;}
  if(act==='redo'){startWrong();return;}
  if(act==='one'){startOne(el.getAttribute('data-id'));return;}
  if(act==='exp'){doExport();return;}
  if(act==='imp'){doImport();return;}
  if(act==='clearw'){
    ask('清空错题本','确定清空错题本吗？此操作不可撤销。','清空',function(){
      W={};saveW();renderWrong();});
    return;
  }
  if(act==='reset'){
    ask('清除全部记录','会同时清掉刷题进度、正确率统计和错题本，且不可撤销。'
      +'<br>如需保留，请先<b>导出进度码</b>。','确定清除',function(){
      W={};STAT={ans:0,ok:0};SEQ={i:0};
      saveW();saveStat();save(K_S,SEQ);renderHome();});
    return;
  }
  if(act==='pick'){pick(parseInt(el.getAttribute('data-k'),10));return;}
  if(act==='prev'){go(-1);return;}
  if(act==='next'){go(1);return;}
  if(act==='jump'){jump();return;}
  if(act==='finish'){finishQuiz();return;}
});
document.addEventListener('keydown',function(e){
  if(!S)return;
  if(ov)return;
  var map={'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3,
           'A':0,'B':1,'C':2,'D':3};
  var id=S.list[S.i],q=byId[id];
  if(map[e.key]!==undefined){
    var k=map[e.key];
    if(k<q.o.length){pick(k);e.preventDefault();}
  }else if(e.key==='ArrowRight'){go(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){go(-1);e.preventDefault();}
});

renderHome();

  try{navigator.serviceWorker.register('sw.js').then(null,function(){});}catch(e){}
}
